name: Deploy Fundora to GitHub Pages

# The repository's Pages site is served from the `gh-pages` branch, and the
# `github-pages` environment only accepts deployments from that branch. So
# instead of deploying from `main` with actions/deploy-pages (which the
# environment rejects), publish the static demo in `public/` to `gh-pages` and
# let GitHub's built-in "pages build and deployment" run take it from there.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish public/ to the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: public
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from main"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
