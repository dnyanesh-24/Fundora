# =========================================================================
# FUNDORA SOCIAL FINTECH - APPLICATION PROPERTIES
# Module III & VI: Spring Boot & Enterprise Web Configuration
# =========================================================================

spring.application.name=fundora-fintech
server.port=8080

# Module III: JSP View Resolver configuration for Tomcat Jasper
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Static Resource Handling
spring.web.resources.static-locations=classpath:/webapp/static/,file:src/main/webapp/static/,classpath:/static/

# Database Configuration (Default: Embedded H2 for zero-friction out-of-the-box running; switchable to MySQL)
spring.datasource.url=jdbc:h2:mem:fundoradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Execute schema.sql on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.com.fundora=DEBUG
logging.level.org.springframework.web=INFO
